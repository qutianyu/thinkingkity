name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: macos
            arch: aarch64
            artifact-name: ThinkingKity-macos-aarch64
            tauri-args: --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            release-files: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact-name: ThinkingKity-linux-x86_64
            tauri-args: --bundles deb,appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/thinkingkity
            release-files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows x64
            os: windows-2025
            platform: windows
            arch: x86_64
            artifact-name: ThinkingKity-windows-x86_64
            tauri-args: --bundles nsis,msi
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/thinkingkity.exe
            release-files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    env:
      THINKINGKITY_UPDATE_PLATFORM: ${{ matrix.platform }}
      THINKINGKITY_UPDATE_ARCH: ${{ matrix.arch }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple signing certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["APPLE_CERTIFICATE"]
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"APPLE_CERTIFICATE is not valid base64: {exc}")

          if not decoded:
              raise SystemExit("APPLE_CERTIFICATE decoded to an empty file")

          Path("certificate.p12").write_bytes(decoded)
          PY

          openssl pkcs12 \
            -in certificate.p12 \
            -info \
            -noout \
            -passin env:APPLE_CERTIFICATE_PASSWORD >/dev/null

          # Re-export through OpenSSL's legacy PKCS#12 mode so macOS security import
          # receives a Keychain-compatible bundle even when the uploaded .p12 was
          # created by a newer OpenSSL version.
          openssl pkcs12 \
            -in certificate.p12 \
            -nocerts \
            -nodes \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -out signing-key.pem

          if ! grep -q "BEGIN .*PRIVATE KEY" signing-key.pem; then
            echo "APPLE_CERTIFICATE is readable, but the .p12 does not contain a private key"
            exit 1
          fi

          openssl pkcs12 \
            -in certificate.p12 \
            -clcerts \
            -nokeys \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -out signing-cert.pem

          openssl pkcs12 \
            -export \
            -legacy \
            -inkey signing-key.pem \
            -in signing-cert.pem \
            -out certificate-legacy.p12 \
            -passout env:APPLE_CERTIFICATE_PASSWORD

          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security import certificate-legacy.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            CERT_ID="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*\"\\(.*\\)\"/\\1/p' | head -n 1)"
            if [ -z "$CERT_ID" ]; then
              echo "Could not infer APPLE_SIGNING_IDENTITY from imported certificate"
              exit 1
            fi
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          fi

          rm -f certificate.p12 certificate-legacy.p12 signing-key.pem signing-cert.pem

      - name: Build desktop bundle
        env:
          # The certificate is already normalized and imported above. Leaving this
          # empty prevents Tauri from attempting a second import of the original
          # uploaded PKCS#12 bundle.
          APPLE_CERTIFICATE: ''
        run: npm run build:desktop -- ${{ matrix.tauri-args }}

      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos'
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found to verify"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release-files }}

  manifest:
    name: Upload latest manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate latest manifest
        run: node scripts/generate-latest-manifest.js release-artifacts latest.json

      - name: Upload manifest asset
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
