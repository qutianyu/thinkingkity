name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14
            os: macos-14
            platform: macos
            experimental: false
            artifact-name: ThinkingKity-macos-14
            tauri-args: --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: macOS 15
            os: macos-15
            platform: macos
            experimental: false
            artifact-name: ThinkingKity-macos-15
            tauri-args: --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: macOS 26
            os: macos-26
            platform: macos
            experimental: false
            artifact-name: ThinkingKity-macos-26
            tauri-args: --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: Linux Ubuntu 22.04
            os: ubuntu-22.04
            platform: linux
            experimental: false
            artifact-name: ThinkingKity-linux-ubuntu-22.04
            tauri-args: --bundles deb,appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/thinkingkity
          - name: Linux Ubuntu 24.04
            os: ubuntu-24.04
            platform: linux
            experimental: false
            artifact-name: ThinkingKity-linux-ubuntu-24.04
            tauri-args: --bundles deb,appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/thinkingkity
          - name: Windows Server 2022
            os: windows-2022
            platform: windows
            experimental: false
            artifact-name: ThinkingKity-windows-2022
            tauri-args: --bundles nsis,msi
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/thinkingkity.exe
          - name: Windows Server 2025
            os: windows-2025
            platform: windows
            experimental: false
            artifact-name: ThinkingKity-windows-2025
            tauri-args: --bundles nsis,msi
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/thinkingkity.exe
          - name: Windows Server 2025 VS 2026
            os: windows-2025-vs2026
            platform: windows
            experimental: true
            artifact-name: ThinkingKity-windows-2025-vs2026
            tauri-args: --bundles nsis,msi
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/thinkingkity.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri:build -- ${{ matrix.tauri-args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThinkingKity-web
          path: |
            dist/**
            thinkingkity-server
          if-no-files-found: error
