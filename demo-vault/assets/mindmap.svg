<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <rect width="500" height="360" fill="#0f172a" rx="12"/>
  <text x="250" y="30" text-anchor="middle" fill="#64748b" font-size="13" font-family="monospace">Knowledge Base Mind Map</text>
  <!-- Center -->
  <circle cx="140" cy="180" r="45" fill="#3b82f6"/>
  <text x="140" y="176" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace" font-weight="bold">Thinking</text>
  <text x="140" y="192" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="monospace">Kity</text>
  <!-- Branch 1 -->
  <line x1="185" y1="165" x2="290" y2="80" stroke="#f59e0b" stroke-width="2"/>
  <rect x="295" y="60" width="90" height="40" rx="8" fill="#f59e0b"/>
  <text x="340" y="85" text-anchor="middle" fill="#1e293b" font-size="11" font-family="monospace">Markdown</text>
  <!-- Branch 2 -->
  <line x1="185" y1="180" x2="290" y2="150" stroke="#10b981" stroke-width="2"/>
  <rect x="295" y="130" width="90" height="40" rx="8" fill="#10b981"/>
  <text x="340" y="155" text-anchor="middle" fill="#1e293b" font-size="11" font-family="monospace">Code Editor</text>
  <!-- Branch 3 -->
  <line x1="185" y1="195" x2="290" y2="220" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="295" y="200" width="90" height="40" rx="8" fill="#8b5cf6"/>
  <text x="340" y="225" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">CSV Grid</text>
  <!-- Branch 4 -->
  <line x1="185" y1="200" x2="295" y2="290" stroke="#ec4899" stroke-width="2"/>
  <rect x="300" y="270" width="90" height="40" rx="8" fill="#ec4899"/>
  <text x="345" y="295" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">Mermaid</text>
  <!-- Branch 5 -->
  <line x1="155" y1="225" x2="100" y2="300" stroke="#6366f1" stroke-width="2"/>
  <rect x="20" y="290" width="90" height="40" rx="8" fill="#6366f1"/>
  <text x="65" y="315" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">AI Chat</text>
  <!-- Branch 6 -->
  <line x1="120" y1="140" x2="60" y2="80" stroke="#ef4444" stroke-width="2"/>
  <rect x="20" y="60" width="80" height="40" rx="8" fill="#ef4444"/>
  <text x="60" y="85" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace">File Tree</text>
  <!-- Sub-branches -->
  <line x1="385" y1="80" x2="430" y2="50" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="50" fill="#f59e0b" font-size="9" font-family="monospace">WYSIWYG</text>
  <line x1="385" y1="155" x2="430" y2="125" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="125" fill="#10b981" font-size="9" font-family="monospace">Common Langs</text>
  <line x1="385" y1="310" x2="430" y2="310" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="310" fill="#6366f1" font-size="9" font-family="monospace">OpenAI / Anthropic</text>
</svg>
