<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <rect width="600" height="320" fill="#1e293b" rx="12"/>
  <text x="300" y="32" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="monospace">System Architecture</text>
  <!-- Browser -->
  <rect x="30" y="100" width="100" height="80" rx="8" fill="#3b82f6" opacity="0.9"/>
  <text x="80" y="130" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace" font-weight="bold">Browser</text>
  <text x="80" y="150" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="monospace">React 19</text>
  <text x="80" y="165" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="monospace">Vite 8</text>
  <!-- Arrow -->
  <line x1="130" y1="140" x2="185" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Server -->
  <rect x="190" y="80" width="130" height="100" rx="8" fill="#8b5cf6" opacity="0.9"/>
  <text x="255" y="115" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace" font-weight="bold">Rust Server</text>
  <text x="255" y="135" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="monospace">tiny_http</text>
  <text x="255" y="150" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="monospace">File CRUD</text>
  <text x="255" y="165" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="monospace">Path Auth</text>
  <!-- Arrow -->
  <line x1="320" y1="130" x2="375" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- FileSystem -->
  <rect x="380" y="95" width="120" height="90" rx="8" fill="#f59e0b" opacity="0.9"/>
  <text x="440" y="125" text-anchor="middle" fill="#1e293b" font-size="12" font-family="monospace" font-weight="bold">File System</text>
  <text x="440" y="145" text-anchor="middle" fill="#78350f" font-size="10" font-family="monospace">Markdown</text>
  <text x="440" y="160" text-anchor="middle" fill="#78350f" font-size="10" font-family="monospace">Code / CSV</text>
  <text x="440" y="175" text-anchor="middle" fill="#78350f" font-size="10" font-family="monospace">Images / PDF</text>
  <!-- Arrow -->
  <line x1="500" y1="140" x2="555" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Storage -->
  <rect x="30" y="230" width="100" height="60" rx="8" fill="#10b981" opacity="0.9"/>
  <text x="80" y="255" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace" font-weight="bold">vaults.json</text>
  <text x="80" y="272" text-anchor="middle" fill="#d1fae5" font-size="9" font-family="monospace">Global Config</text>
  <rect x="190" y="230" width="130" height="60" rx="8" fill="#ec4899" opacity="0.9"/>
  <text x="255" y="255" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace" font-weight="bold">.thinkingkity/</text>
  <text x="255" y="272" text-anchor="middle" fill="#fce7f3" font-size="9" font-family="monospace">Per-Vault Config</text>
  <rect x="380" y="230" width="120" height="60" rx="8" fill="#6366f1" opacity="0.9"/>
  <text x="440" y="255" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace" font-weight="bold">Tauri IPC</text>
  <text x="440" y="272" text-anchor="middle" fill="#c7d2fe" font-size="9" font-family="monospace">Desktop Mode</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
