# ThinkingKity Properties Configuration
# This format is commonly used in Java / Spring applications

app.name=ThinkingKity
app.version=1.0.0
app.description=A local-first knowledge base for your notes, code, and data

server.host=0.0.0.0
server.port=8080
server.max-threads=16

database.url=jdbc:postgresql://localhost:5432/thinkingkity
database.username=app_user
database.password=changeme
database.pool-size=10

logging.level.root=INFO
logging.level.com.thinkingkity=DEBUG
logging.file=/var/log/thinkingkity/app.log
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

feature.ai-assistant.enabled=true
feature.vault-sync.enabled=true
feature.plugins.enabled=false
