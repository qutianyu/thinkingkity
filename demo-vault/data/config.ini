; ThinkingKity Configuration (INI format)

[app]
name = ThinkingKity
version = 1.0.0
debug = false

[editor]
font_size = 14
tab_size = 4
word_wrap = true
line_numbers = true

[theme]
mode = system
accent_color = #6366f1
font_family = Inter, system-ui, sans-serif

[ai]
provider = anthropic
model = claude-sonnet-4-20250514
max_tokens = 8192
temperature = 0.7

[sync]
method = git
direction = push
; WebDAV settings below are inactive when method is git
