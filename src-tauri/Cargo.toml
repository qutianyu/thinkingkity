[package]
name = "thinkingkity"
version = "0.9.1"
description = "A knowledge base app"
authors = ["you"]
edition = "2021"
default-run = "thinkingkity"

[lib]
name = "thinkingkity"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
mime_guess = "2"
tiny_http = "0.12"
rust-embed = "8"
ureq = "3"
chrono = "0.4"
url = "2"

[[bin]]
name = "thinkingkity"
path = "src/main.rs"

[[bin]]
name = "thinkingkity-server"
path = "src/bin/server.rs"
