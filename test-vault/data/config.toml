# ThinkingKity Application Configuration (TOML)

[app]
name = "ThinkingKity"
version = "0.1.0"

[editor]
font_size = 14
tab_size = 2
line_numbers = true
word_wrap = true
rulers = [80, 120]

[theme]
mode = "system"
accent_color = "#3b82f6"

[ai]
provider = "anthropic"
default_model = "claude-sonnet-4-20250514"

[ai.parameters]
temperature = 0.7
max_tokens = 4096
top_p = 1.0

[keybindings]
quick_switch = "Ctrl+P"
save_file = "Ctrl+S"
new_note = "Ctrl+N"

[[languages]]
code = "en-US"
name = "English"

[[languages]]
code = "zh-CN"
name = "简体中文"

[[languages]]
code = "zh-TW"
name = "繁體中文"

[features]
markdown_editor = true
code_editor = true
csv_editor = true
ai_assistant = true
image_viewer = true
pdf_viewer = true
